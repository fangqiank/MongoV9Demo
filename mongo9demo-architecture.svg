<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="880" height="430" fill="#fafafa"/>
  <rect x="1" y="1" width="878" height="428" fill="none" stroke="#ddd" rx="8"/>

  <!-- 顶层：控制台程序 -->
  <rect x="40" y="36" width="800" height="112" rx="10" fill="#eef4ff" stroke="#4a7ad9"/>
  <text x="60" y="62" font-size="16" font-weight="600" fill="#1a3a6b">MongoV9Demo（.NET 10 控制台，top-level statements）</text>
  <g font-size="13" fill="#24457a">
    <rect x="60" y="76" width="180" height="28" rx="6" fill="#ffffff" stroke="#8aa8d8"/>
    <text x="72" y="95">SeedAsync：1万 + 10万</text>
    <rect x="252" y="76" width="180" height="28" rx="6" fill="#ffffff" stroke="#8aa8d8"/>
    <text x="264" y="95">Join / Query 管道×2</text>
    <rect x="444" y="76" width="180" height="28" rx="6" fill="#ffffff" stroke="#8aa8d8"/>
    <text x="456" y="95">$hash + 8.x 替代×2</text>
    <rect x="636" y="76" width="184" height="28" rx="6" fill="#ffffff" stroke="#8aa8d8"/>
    <text x="648" y="95">Filter 四式 / Deserialize</text>
    <rect x="60" y="110" width="180" height="28" rx="6" fill="#ffffff" stroke="#8aa8d8"/>
    <text x="72" y="129">Program.cs 顶部连接串</text>
    <rect x="252" y="110" width="372" height="28" rx="6" fill="#fff8e8" stroke="#c9a54a"/>
    <text x="264" y="129">Models.cs：Passenger / Booking POCO（PascalCase 原样入库）</text>
  </g>

  <!-- 箭头 -->
  <line x1="440" y1="148" x2="440" y2="188" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>
  <text x="452" y="172" font-size="12" fill="#555">MongoDB.Driver 3.12（v3 API / LINQ3 / BsonDocument）</text>

  <!-- 中层：驱动 -->
  <rect x="180" y="192" width="520" height="56" rx="10" fill="#eefaf0" stroke="#3f9d55"/>
  <text x="440" y="216" font-size="15" font-weight="600" text-anchor="middle" fill="#1d5c2c">MongoDB .NET Driver 3.12</text>
  <text x="440" y="236" font-size="12" text-anchor="middle" fill="#2e6b40">Builders.Filter · Aggregate&lt;T&gt; · BsonSerializer · EncStr*（QE filter）</text>

  <!-- 箭头 -->
  <line x1="440" y1="248" x2="440" y2="288" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <text x="452" y="272" font-size="12" fill="#555">directConnection=true（副本集单节点）</text>

  <!-- 底层：MongoDB 容器 -->
  <rect x="180" y="292" width="520" height="110" rx="10" fill="#f3eee8" stroke="#7a9a4a"/>
  <text x="440" y="316" font-size="15" font-weight="600" text-anchor="middle" fill="#4a5c23">MongoDB 9.0.2（PVE LXC · OCI 镜像 mongo:9.0.2）</text>
  <rect x="220" y="332" width="200" height="52" rx="6" fill="#ffffff" stroke="#a8b98a"/>
  <text x="320" y="354" font-size="13" text-anchor="middle" fill="#3d4a26">travel.passengers</text>
  <text x="320" y="372" font-size="12" text-anchor="middle" fill="#6b7a4a">10,000 docs</text>
  <rect x="460" y="332" width="200" height="52" rx="6" fill="#ffffff" stroke="#a8b98a"/>
  <text x="560" y="354" font-size="13" text-anchor="middle" fill="#3d4a26">travel.bookings</text>
  <text x="560" y="372" font-size="12" text-anchor="middle" fill="#6b7a4a">100,000 docs</text>
</svg>
